name: norovirus
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bygul
  # Runtime
  - python=3.11.4
  - pip=22.0.3

  # Nextstrain, alignment, phylogeny, and barcode creation
  - augur
  - mafft
  - iqtree
  - barcodeforge=1.1.5
  - gofasta=1.2.3

  # Later competitive mapping and Freyja stages
  - freyja=2.0.3
  - bwa-mem2=2.3
  - samtools
  - bcftools
  - ivar
  - salmon
  - seqkit

  # File transfer and compression
  - wget
  - curl
  - zstd
  - pigz

  # Python analysis libraries used by the scripts
  - pandas
  - numpy
  - scipy
  - biopython
  - tqdm
  - pysam
  - pip:
      - pandas
      - biopython
      - tqdm

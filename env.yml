name: NV
channels:
  - conda-forge
  - bioconda

dependencies:
  # Runtime
  - python=3.11.4

  # Reference selection and mapping
  - barcodeforge=1.1.5
  - bwa-mem2=2.3
  - samtools
  - seqkit
  - bygul

  # File transfer and compression
  - wget
  - curl
  - zstd
  - pigz

  # Read QC and processing
  - fastqc
  - multiqc
  - fastp

  # Python libraries
  - pandas
  - numpy
  - scipy
  - biopython
  - tqdm
  - pysam
